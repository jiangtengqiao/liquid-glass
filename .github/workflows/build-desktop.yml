name: Build Windows Desktop

on:
  push:
    branches: [ main ]
    paths:
      - 'LiquidGlassDesktop/**'
      - '.github/workflows/build-desktop.yml'
      - 'version.json'
      - 'beta-version.json'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write  # 上传 Release 资产必需
    steps:
      - uses: actions/checkout@v4

      - name: Read version from version.json
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content version.json -Raw | ConvertFrom-Json)
          Write-Host "version=$($v.version)"
          echo "VERSION=$($v.version)" >> $env:GITHUB_OUTPUT

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install WiX Toolset (jpackage 打 exe 必需)
        shell: pwsh
        run: choco install wixtoolset -y --no-progress

      - name: Build Desktop App
        working-directory: LiquidGlassDesktop
        run: ./gradlew packageDistributionForCurrentOS --no-daemon

      - name: Print jpackage error logs (on failure)
        if: failure()
        working-directory: LiquidGlassDesktop
        shell: pwsh
        run: |
          Write-Host "===== Searching for jpackage logs ====="
          Get-ChildItem -Path "build/compose/logs" -Recurse -Filter "*.txt" -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host ""
            Write-Host "===== FILE: $($_.FullName) ====="
            Get-Content $_.FullName
            Write-Host "===== END: $($_.FullName) ====="
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LiquidGlass-Desktop-${{ steps.ver.outputs.VERSION }}
          path: LiquidGlassDesktop/build/compose/binaries/main/exe/*

      - name: Upload exe to GitHub Release
        if: success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.VERSION }}
        run: |
          $exePath = Get-ChildItem "LiquidGlassDesktop/build/compose/binaries/main/exe/*.exe" | Select-Object -First 1
          if (-not $exePath) {
            Write-Host "No exe found, skip release upload"
            exit 0
          }
          Write-Host "Uploading: $($exePath.FullName)"
          $tag = "v$env:VERSION"
          # 确保 Release 存在（不存在则创建）
          gh release create $tag --repo ${{ github.repository }} --title "$tag" --notes "Windows Desktop $tag - 翻译中心+桌面工具集+安装包升级修复" --target main 2>$null
          # 上传 exe 资产（如已存在同名资产会覆盖）
          gh release upload $tag "$($exePath.FullName)" --repo ${{ github.repository }} --clobber
          Write-Host "Upload complete"
